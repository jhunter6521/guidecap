<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northwind Admin · Users</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c2230; background: #f3f5f9; }
  .top { background: #1f2a44; color: #fff; padding: 14px 28px; font-weight: 700; display: flex; gap: 28px; }
  .top span { font-weight: 400; opacity: .75; }
  .wrap { display: grid; grid-template-columns: 200px 1fr; }
  nav { padding: 20px; display: grid; gap: 6px; align-content: start; }
  nav a { color: #1c2230; text-decoration: none; padding: 8px 12px; border-radius: 8px; }
  nav a.on { background: #dfe7ff; font-weight: 600; }
  main { padding: 24px 32px; }
  h1 { margin: 0 0 16px; font-size: 1.5rem; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #e6e9f0; }
  th { background: #f8f9fc; font-size: .85rem; color: #5b6477; }
  button { font: inherit; border: 1px solid #cfd6e4; background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: #2f5bea; border-color: #2f5bea; color: #fff; }
  .panel { margin-top: 20px; background: #fff; border-radius: 10px; padding: 20px; max-width: 520px; display: none; }
  .panel.show { display: block; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cfd6e4; border-radius: 8px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
</style>
</head>
<body>
  <div class="top">Northwind Admin <span>Users</span><span>Devices</span><span>Billing</span></div>
  <div class="wrap">
    <nav><a href="#">Dashboard</a><a class="on" href="#">Users</a><a href="#">Groups</a><a href="#">Security</a></nav>
    <main>
      <h1>Users</h1>
      <table>
        <tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>
        <tr><td>Maria Lopez</td><td>maria.lopez@northwind.example</td><td>Finance</td><td><button id="reset1" onclick="document.querySelector('.panel').classList.add('show')">Reset password</button></td></tr>
        <tr><td>James Carter</td><td>james.carter@northwind.example</td><td>Sales</td><td><button>Reset password</button></td></tr>
        <tr><td>Priya Shah</td><td>priya.shah@northwind.example</td><td>Engineering</td><td><button>Reset password</button></td></tr>
      </table>
      <div class="panel">
        <b>Reset password for Maria Lopez</b>
        <label for="tmp">Temporary password</label><input id="tmp" type="password">
        <div class="row"><input type="checkbox" id="force" style="width:auto"><label for="force" style="margin:0;font-weight:400">Require change at next sign-in</label></div>
        <div class="row"><button class="primary" id="save">Reset password</button><button>Cancel</button></div>
      </div>
    </main>
  </div>
</body>
</html>
